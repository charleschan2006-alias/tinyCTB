[package]
name = "tinyctb"
version = "0.2.5"
edition = "2021"
description = "Telegram away-mode control for local Claude Code sessions"
license = "MIT"
rust-version = "1.81"
keywords = ["claude", "telegram", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
libc = "0.2"
notify = "8"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ureq = { version = "3", features = ["json"] }
url = "2"
which = "8"
